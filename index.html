<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player</title>
<style>
:root{--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--red:#ff0033}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Roboto,"Noto Sans KR",Arial,sans-serif;font-size:14px}
button{font-family:inherit}
header{position:sticky;top:0;z-index:10;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:18px;letter-spacing:-.5px;white-space:nowrap;cursor:pointer}
.logo i{display:inline-grid;place-items:center;width:30px;height:21px;border-radius:6px;background:var(--red)}
.logo i:after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
form{flex:1;max-width:640px;margin:0 auto;display:flex}
form input{flex:1;min-width:0;height:40px;padding:0 16px;background:#121212;border:1px solid #303030;border-right:0;border-radius:40px 0 0 40px;color:var(--tx);font-size:16px;outline:none}
form input:focus{border-color:#1c62b9}
form button{width:64px;height:40px;background:#222;border:1px solid #303030;border-radius:0 40px 40px 0;color:var(--tx);cursor:pointer;font-size:16px}
.icon{width:40px;height:40px;border-radius:50%;background:none;border:0;color:var(--tx);font-size:18px;cursor:pointer}
.icon:hover{background:var(--bg2)}

#home{padding:0 24px 24px;max-width:2200px;margin:0 auto}
.chips{display:flex;gap:12px;padding:12px 0;overflow-x:auto;position:sticky;top:56px;background:var(--bg);z-index:5;scrollbar-width:none}
.chip{padding:6px 12px;border-radius:8px;background:var(--bg2);white-space:nowrap;font-weight:500;cursor:pointer;border:0;color:var(--tx);font-size:14px}
.chip:hover{background:var(--bg3)}
.chip.on{background:var(--tx);color:#0f0f0f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px;padding-top:12px}
.card{cursor:pointer}
.card .thumb{width:100%;border-radius:12px}
.card .row2{display:flex;gap:12px;margin-top:12px}
.card .avatar{width:36px;height:36px;font-size:14px}
.card b{font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--tx2);font-size:14px;display:block;margin-top:4px;line-height:20px}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);padding:1px 4px;border-radius:4px;font-size:12px;font-weight:500}
.avatar{border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-weight:700;flex-shrink:0}

#watch{display:none;gap:24px;padding:24px;max-width:1750px;margin:0 auto}
body.watching #watch{display:flex}
body.watching #home{display:none}
#primary{flex:1;min-width:0}
#secondary{width:402px;flex-shrink:0}
body.theater #watch{flex-direction:column}
body.theater #secondary{width:100%}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
body.theater .player{border-radius:0;max-height:calc(100vh - 160px);width:100%}
.player iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
h1{font-size:20px;font-weight:700;margin:12px 0 8px;line-height:28px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chan{flex:1;display:flex;align-items:center;gap:12px;min-width:200px}
.chan .avatar{width:40px;height:40px}
.chan b{display:block;font-size:16px}
.pill{height:36px;padding:0 16px;border-radius:18px;background:var(--bg2);border:0;color:var(--tx);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill:hover{background:var(--bg3)}
.pill.on{background:var(--tx);color:#0f0f0f}
.desc{margin-top:12px;background:var(--bg2);border-radius:12px;padding:12px;line-height:20px;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:hidden;cursor:pointer}
.desc.open{max-height:none}
.item{display:flex;gap:8px;margin-bottom:8px;cursor:pointer;border-radius:8px}
.item:hover{background:#1a1a1a}
.item .thumb{width:168px;flex-shrink:0;border-radius:8px}
.meta{flex:1;min-width:0;padding:2px 4px 2px 0}
.meta b{font-size:14px;line-height:20px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{color:var(--tx2);font-size:12px;display:block;margin-top:4px;line-height:18px}
.msg{color:var(--tx2);padding:40px 0;text-align:center;line-height:1.8;grid-column:1/-1}
.sk{background:var(--bg2);border-radius:12px;aspect-ratio:16/9;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.5}}

dialog{margin:auto;background:#212121;color:var(--tx);border:0;border-radius:12px;padding:24px;max-width:440px;width:calc(100% - 32px);line-height:1.6}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:18px;margin-bottom:8px}
dialog p{color:var(--tx2);font-size:13px;margin-bottom:12px}
dialog input{width:100%;height:40px;padding:0 12px;background:#121212;border:1px solid #303030;border-radius:8px;color:var(--tx);font-size:14px;margin-bottom:12px}
dialog a{color:#3ea6ff}
.toast{position:fixed;left:24px;bottom:24px;background:#f1f1f1;color:#0f0f0f;padding:12px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media(max-width:1000px){#watch{flex-direction:column;padding:0 0 24px}#secondary{width:100%;padding:0 12px}.info{padding:0 12px}.player{border-radius:0}.logo span{display:none}header{gap:8px;padding:0 8px}#home{padding:0 12px 24px}}
@media(max-width:500px){.item .thumb{width:150px}h1{font-size:18px}.grid{grid-template-columns:1fr;gap:24px}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"><i></i><span>Player</span></div>
  <form id="f"><input id="q" type="search" placeholder="검색" autocomplete="off"><button title="검색">🔍</button></form>
  <button class="icon" id="gear" title="설정">⚙</button>
</header>

<section id="home">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="watch">
  <div id="primary">
    <div class="player"><div id="yt"></div></div>
    <div class="info">
      <h1 id="title"></h1>
      <div class="row">
        <div class="chan"><div class="avatar" id="av"></div><div><b id="author"></b></div></div>
        <button class="pill" id="auto">자동재생</button>
        <button class="pill" id="speed">1x</button>
        <button class="pill" id="theater">▭ 극장 모드</button>
        <button class="pill" id="share">🔗 공유</button>
      </div>
      <div class="desc" id="desc"></div>
    </div>
  </div>
  <aside id="secondary"><div id="related"></div></aside>
</section>

<dialog id="dlg">
  <h2>설정</h2>
  <p>검색과 인기 영상은 키 없이도 공개 서버를 통해 불러와요. 가끔 그 서버가 느리거나 막히면, 무료 YouTube API 키를 넣으면 훨씬 안정적이에요.<br>
  <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">Google Cloud</a>에서 YouTube Data API v3 사용 설정 → 사용자 인증 정보 → API 키 만들기</p>
  <input id="key" placeholder="YouTube API 키 (선택)">
  <div class="row" style="justify-content:flex-end"><button class="pill" id="dlgx">닫기</button><button class="pill on" id="dlgok">저장</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.getElementById(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let KEY=LS.get('ytkey',''),autoplay=LS.get('auto',true),player,ready=false,cur=null,related=[],speeds=[1,1.25,1.5,2,0.5,0.75],si=0,history_=LS.get('hist',[]);
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDur=s=>{s=+s||0;if(!s)return'';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtViews=n=>{n=+n;if(!n&&n!==0||isNaN(n))return'';return'조회수 '+(n>=1e8?(n/1e8).toFixed(1).replace('.0','')+'억':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1).replace('.0','')+'만':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'천':n)+'회'};
const isoDur=d=>{const m=(d||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
const ago=t=>{const d=(Date.now()-new Date(t))/1000;if(isNaN(d))return'';const u=[[31536000,'년'],[2592000,'개월'],[604800,'주'],[86400,'일'],[3600,'시간'],[60,'분']];for(const[s,n]of u)if(d>=s)return Math.floor(d/s)+n+' 전';return'방금 전'};


const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de','https://pipedapi.leptons.xyz'];
const INV=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de','https://iv.ggtyler.dev','https://invidious.privacyredirect.com'];
const tmo=(u,ms=7000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).then(r=>{clearTimeout(t);if(!r.ok)throw 0;return r.json()})};
let goodP=LS.get('goodP',0),goodI=LS.get('goodI',0);
async function tryList(list,startIdx,saveKey,fn){for(let k=0;k<list.length;k++){const i=(startIdx+k)%list.length;try{const r=await fn(list[i]);if(r&&r.length){LS.set(saveKey,i);return r}}catch(e){}}return null}
const pv=x=>({id:(x.url||'').split('v=')[1]?.slice(0,11),t:x.title,a:x.uploaderName||x.uploader,dur:x.duration,views:x.views,when:x.uploadedDate||'',thumb:x.thumbnail});
const iv=x=>({id:x.videoId,t:x.title,a:x.author,dur:x.lengthSeconds,views:x.viewCount,when:x.publishedText||''});
const yv=x=>({id:x.id.videoId||x.id,t:x.snippet.title,a:x.snippet.channelTitle,dur:x.contentDetails?isoDur(x.contentDetails.duration):0,views:x.statistics?.viewCount,when:ago(x.snippet.publishedAt),desc:x.snippet.description});
const decode=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};

async function apiTrending(cat){
  if(KEY){try{const j=await tmo(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=KR&maxResults=48${cat?'&videoCategoryId='+cat:''}&key=${KEY}`);return j.items.map(yv)}catch(e){toast('API 키 오류 — 공개 서버로 불러올게요')}}
  const r=await tryList(PIPED,goodP,'goodP',async b=>(await tmo(`${b}/trending?region=KR`)).map(pv));
  if(r)return r;
  return await tryList(INV,goodI,'goodI',async b=>(await tmo(`${b}/api/v1/trending?region=KR${cat?'&type='+({10:'music',20:'gaming',1:'movies'}[cat]||''):''}`)).map(iv))||[];
}
async function apiSearch(q){
  if(KEY){try{const j=await tmo(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=40&regionCode=KR&q=${encodeURIComponent(q)}&key=${KEY}`);
    const ids=j.items.map(x=>x.id.videoId).join(',');
    const d=await tmo(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${KEY}`);return d.items.map(yv)}catch(e){toast('API 키 오류 — 공개 서버로 검색할게요')}}
  const r=await tryList(PIPED,goodP,'goodP',async b=>(await tmo(`${b}/search?q=${encodeURIComponent(q)}&filter=videos`)).items.filter(x=>x.type==='stream'||x.url?.includes('watch')).map(pv));
  if(r)return r;
  return await tryList(INV,goodI,'goodI',async b=>(await tmo(`${b}/api/v1/search?q=${encodeURIComponent(q)}&type=video&region=KR`)).filter(x=>x.type==='video').map(iv))||[];
}
async function apiVideo(v){
  if(KEY){try{const j=await tmo(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${v.id}&key=${KEY}`);const d=yv(j.items[0]);
      let rel=await apiSearch(d.a||d.t);rel=rel.filter(x=>x.id!==v.id);if(rel.length<10)rel=rel.concat((await apiSearch(d.t)).filter(x=>x.id!==v.id&&!rel.some(y=>y.id===x.id)));return{d,rel}}catch(e){}}
  for(let k=0;k<PIPED.length;k++){const b=PIPED[(goodP+k)%PIPED.length];try{const j=await tmo(`${b}/streams/${v.id}`);
      const t=document.createElement('div');t.innerHTML=(j.description||'').replace(/<br\s*\/?>/g,'\n');
      return{d:{t:j.title,a:j.uploader,views:j.views,when:j.uploadDate,desc:t.textContent},rel:(j.relatedStreams||[]).filter(x=>x.type==='stream'||x.url?.includes('watch')).map(pv)}}catch(e){}}
  for(let k=0;k<INV.length;k++){const b=INV[(goodI+k)%INV.length];try{const j=await tmo(`${b}/api/v1/videos/${v.id}`);
      return{d:{t:j.title,a:j.author,views:j.viewCount,when:j.publishedText,desc:j.description},rel:(j.recommendedVideos||[]).map(iv)}}catch(e){}}
  return{d:{},rel:(await apiSearch(v.a||v.t||'')).filter(x=>x.id!==v.id)};
}


const CATS=[['전체',''],['음악','10'],['게임','20'],['영화','1'],['시청 기록','hist']];let catNow='';
function chips(){$('chips').innerHTML='';CATS.forEach(([n,c])=>{const b=document.createElement('button');b.className='chip'+(c===catNow?' on':'');b.textContent=n;b.onclick=()=>{catNow=c;chips();c==='hist'?showGrid(history_,'아직 본 영상이 없어요.'):loadHome()};$('chips').appendChild(b)})}
const thumbOf=v=>v.thumb||`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
const sub=v=>[fmtViews(v.views),v.when].filter(Boolean).join(' • ');
function showGrid(list,empty){const G=$('grid');G.innerHTML='';
  if(!list.length){G.innerHTML=`<div class="msg">${empty}</div>`;return}
  list.filter(v=>v.id).forEach(v=>{const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="thumb"><img loading="lazy" src="${esc(thumbOf(v))}">${v.dur?`<span class="dur">${fmtDur(v.dur)}</span>`:''}</div>
    <div class="row2"><div class="avatar">${esc((v.a||'?')[0])}</div><div><b>${esc(decode(v.t||''))}</b><small>${esc(v.a||'')}<br>${esc(sub(v))}</small></div></div>`;
    d.onclick=()=>watch(v);G.appendChild(d)})}
function skel(){$('grid').innerHTML=Array(12).fill('<div><div class="sk"></div></div>').join('')}
async function loadHome(){skel();const r=await apiTrending(catNow);showGrid(r,'영상을 불러오지 못했어요.<br>공개 서버가 잠시 막혔을 수 있어요. ⚙ 설정에서 API 키를 넣으면 안정적으로 볼 수 있어요.')}
async function search(q){
  const id=parseId(q);if(id){watch({id});return}
  goHome(false);catNow='x';chips();skel();const r=await apiSearch(q);showGrid(r,`"${esc(q)}" 검색 결과를 불러오지 못했어요.<br>잠시 후 다시 해 보거나 ⚙ 설정에서 API 키를 넣어 주세요.`)}
function parseId(s){s=s.trim();try{if(!/^https?:|youtu/.test(s))return null;const u=new URL(s.startsWith('http')?s:'https://'+s);let v=u.searchParams.get('v');if(!v&&u.hostname.includes('youtu.be'))v=u.pathname.slice(1,12);if(!v){const m=u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);if(m)v=m[2]}return v}catch(e){return null}}


async function watch(v,push=true){
  cur=v;document.body.classList.add('watching');window.scrollTo(0,0);
  if(push)history.pushState({v},'','#'+v.id);
  if(ready)player.loadVideoById(v.id);
  setInfo(v);$('related').innerHTML='<div class="sk" style="margin-bottom:8px"></div>'.repeat(6);
  const {d,rel}=await apiVideo(v);if(cur!==v)return;
  Object.assign(v,Object.fromEntries(Object.entries(d).filter(([k,x])=>x)));setInfo(v);
  related=rel.filter(x=>x.id&&x.id!==v.id);renderRelated();
  history_=[{id:v.id,t:v.t,a:v.a,dur:v.dur,views:v.views,when:v.when}].concat(history_.filter(x=>x.id!==v.id)).slice(0,60);LS.set('hist',history_);
}
function setInfo(v){$('title').textContent=decode(v.t||'');$('author').textContent=v.a||'';$('av').textContent=(v.a||'?')[0];
  document.title=(v.t?decode(v.t)+' - ':'')+'Player';
  const top=sub(v);$('desc').textContent=(top?top+'\n':'')+(v.desc||'');$('desc').classList.remove('open')}
function renderRelated(){const L=$('related');L.innerHTML='';
  if(!related.length){L.innerHTML='<div class="msg">관련 영상을 불러오지 못했어요.</div>';return}
  related.forEach(v=>{const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="thumb"><img loading="lazy" src="${esc(thumbOf(v))}">${v.dur?`<span class="dur">${fmtDur(v.dur)}</span>`:''}</div><div class="meta"><b>${esc(decode(v.t||''))}</b><small>${esc(v.a||'')}<br>${esc(sub(v))}</small></div>`;
    d.onclick=()=>watch(v);L.appendChild(d)})}
function goHome(push=true){if(ready&&document.body.classList.contains('watching'))player.pauseVideo();document.body.classList.remove('watching');document.title='Player';if(push)history.pushState({},'',location.pathname)}
window.onpopstate=e=>{const v=e.state&&e.state.v;v?watch(v,false):goHome(false)};

window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{playerVars:{autoplay:1,rel:0,playsinline:1},
  events:{onReady:()=>{ready=true;if(cur)player.loadVideoById(cur.id)},
    onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&autoplay&&related[0])watch(related[0])},
    onError:()=>{toast('이 영상은 여기서 재생할 수 없어요'+(autoplay&&related[0]?' — 다음 영상으로 넘어갈게요':''));if(autoplay&&related[0])setTimeout(()=>watch(related[0]),1500)}}})};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);


$('f').onsubmit=e=>{e.preventDefault();const q=$('q').value.trim();if(q){$('q').blur();search(q)}};
$('logo').onclick=()=>{goHome();catNow='';chips();loadHome()};
const setAuto=()=>{$('auto').classList.toggle('on',autoplay);$('auto').textContent=autoplay?'자동재생 켜짐':'자동재생 꺼짐'};
$('auto').onclick=()=>{autoplay=!autoplay;LS.set('auto',autoplay);setAuto()};
$('speed').onclick=function(){si=(si+1)%speeds.length;this.textContent=speeds[si]+'x';ready&&player.setPlaybackRate(speeds[si])};
$('theater').onclick=()=>document.body.classList.toggle('theater');
$('desc').onclick=function(){this.classList.toggle('open')};
$('share').onclick=()=>{if(!cur)return;const u='https://youtu.be/'+cur.id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('링크 복사됨'),()=>prompt('링크',u))};
$('gear').onclick=()=>{$('key').value=KEY;$('dlg').showModal()};
$('dlgx').onclick=()=>$('dlg').close();
$('dlgok').onclick=()=>{KEY=$('key').value.trim();LS.set('ytkey',KEY);$('dlg').close();toast(KEY?'API 키 저장됨':'API 키 삭제됨');if(!document.body.classList.contains('watching'))loadHome()};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
  if(k==='/'){e.preventDefault();$('q').focus();return}
  if(!ready||!document.body.classList.contains('watching'))return;
  if(k===' '||k==='k'){e.preventDefault();player.getPlayerState()===1?player.pauseVideo():player.playVideo()}
  else if(k==='arrowright'||k==='l')player.seekTo(player.getCurrentTime()+(k==='l'?10:5),true);
  else if(k==='arrowleft'||k==='j')player.seekTo(player.getCurrentTime()-(k==='j'?10:5),true);
  else if(k==='n'&&e.shiftKey&&related[0])watch(related[0]);
  else if(k==='t')document.body.classList.toggle('theater');
  else if(k==='m')player.isMuted()?player.unMute():player.mute();
  else if(k==='f'){const p=document.querySelector('.player');document.fullscreenElement?document.exitFullscreen():p.requestFullscreen&&p.requestFullscreen()}});

setAuto();chips();
const h=location.hash.slice(1);if(/^[\w-]{11}$/.test(h)){history.replaceState({v:{id:h}},'');watch({id:h},false)}
loadHome();
</script>
